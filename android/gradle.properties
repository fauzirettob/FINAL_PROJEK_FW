# ── JVM: alokasi memori lebih besar untuk build yang lebih cepat ──
org.gradle.jvmargs=-Xmx4G -Xss512k -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError

# ── AndroidX ──
android.useAndroidX=true

# ── Nonaktifkan Kotlin built-in (pakai versi dari settings.gradle.kts) ──
android.builtInKotlin=false

# ── Suppress KGP (Kotlin Gradle Plugin) version warning ──
flutter.suppressKgpWarning=true

# ── Paralelisme: manfaatkan CPU multi-core ──
org.gradle.workers.max=4

# ── Daemon: hidupkan agar build berikutnya lebih cepat ──
org.gradle.daemon=true

# ── Konfigurasi on-demand ──
org.gradle.configureondemand=true

# ── Caching ──
org.gradle.caching=true
org.gradle.parallel=true

# ── Kotlin ──
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx512m

# ── Nonaktifkan New DSL (dari Flutter migrator) ──
android.newDsl=false
